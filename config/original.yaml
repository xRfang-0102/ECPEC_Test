# =============================================================================
# 原始超参数（仓库 config.py 的硬编码默认值）
# -----------------------------------------------------------------------------
# 与 config/default.yaml 的区别仅在于:
#   batch_size:     256 -> 128
#   learning_rate:  8e-5 -> 4e-5
# 其余未列出的参数会回退到 config.py 中的原始默认值（本来就是"原来的设置"）。
#
# 用法: python train.py --config config/original.yaml
# =============================================================================

batch_size: 128
learning_rate: 4e-5